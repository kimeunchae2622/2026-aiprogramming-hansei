<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff9f68">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>반려동물 추억 저장소</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="추억저장소">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script>
    /* 첫 화면이 깜빡이지 않도록 저장된 꾸미기 설정을 먼저 적용 (자세한 처리는 js/theme.js) */
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('pet-memories-settings') || '{}'), d = document.documentElement;
        var dark = s.mode === 'dark' || (s.mode !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        d.dataset.theme = dark ? 'dark' : 'light';
        d.dataset.style = s.style === 'timeline' ? 'timeline' : 'card';
        if (/^#[0-9a-f]{6}$/i.test(s.accent || '')) d.style.setProperty('--accent', s.accent);
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app"><p class="loading">불러오는 중…</p></div>
  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript><p class="loading">이 앱을 쓰려면 자바스크립트가 켜져 있어야 해요.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
